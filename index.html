<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Padaria Pão de Mel — Produção e Perdas</title>

    <!-- Instalação como app (ver vite.config.ts para o manifest completo). -->
    <!-- BRANCO (ago/2026, decisão do dono do negócio: "retire o fundo
         amarelado do splash").

         Esta cor pinta a barra do sistema e, no computador, a barra de
         título da janela do app. Ela participa da ABERTURA junto do
         background_color do manifesto, e era o último creme que sobrava
         perto da logomarca na hora de abrir.

         O preço, registrado de propósito: a barra fica branca e o fundo
         do app segue creme, então existe uma emenda no topo. Foi a troca
         escolhida — o vermelho da marca já tinha sido testado aqui e
         reprovado por brigar com a paleta calma de dentro do app. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Cronograma de produção diária e registro de perdas da Padaria Pão de Mel." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- O de 180 existe para quem desenha o ícone GRANDE: aba fixada,
         atalho na área de trabalho, lista de favoritos. Sem ele o
         navegador estica o de 32 e a marca fica borrada justamente onde
         havia espaço para ela ser lida. -->
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180x180.png" />
    <!-- iOS ignora o manifest para o ícone: usa esta tag e as duas abaixo. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pão de Mel" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
