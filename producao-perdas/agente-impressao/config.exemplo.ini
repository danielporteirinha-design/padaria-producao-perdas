; Copie este arquivo para config.ini (na mesma pasta) e preencha.
; O config.ini NAO vai para o GitHub — contem a senha da conta da impressora.

[firebase]
; Os tres primeiros valores estao em src/lib/firebase.ts, no projeto.
api_key = AIzaSyAWQq1TVzd9ycS8tpwl-lxmj7SPek0Pyuc
projeto = producao-padaria-pao-de-mel

; Conta criada so' para a impressora, no console do Firebase.
; NAO use a senha da matriz aqui: esta conta so' pode ver a fila de
; impressao, e e' isso que limita o estrago se este PC for comprometido.
email = impressora@paodemel.local
senha = COLOQUE_A_SENHA_AQUI

[impressora]
; Nome EXATO como aparece em Painel de Controle > Dispositivos e Impressoras.
; Se tiver espaco ou acento, escreva igual — nao precisa de aspas.
nome = COLOQUE_O_NOME_DA_IMPRESSORA_AQUI

; Largura util em pontos. 576 = bobina de 80mm a 203dpi (o padrao).
; Para bobina de 58mm, troque para 384.
largura_pontos = 576
